location = /where_to_eat {
    return 301 /where_to_eat/;
}
location ^~ /where_to_eat/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    # Override the root site's policies, which disallow API requests/forms.
    # CSP itself is supplied by the application nginx container.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
}
