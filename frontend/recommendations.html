<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推荐榜单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="page-list">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel list-header-panel">
        <div>
          <a id="back-to-home-link" class="ghost-link" href="/">返回筛选</a>
          <p class="eyebrow">Campus Comment Feed</p>
          <h1>先看学校附近大家最近都在说什么</h1>
        </div>
        <div id="active-filters" class="filter-summary"></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="sort-tabs">
            <button class="sort-tab is-active" data-sort="review_count">评论更多</button>
            <button class="sort-tab" data-sort="avg_price">预算更友好</button>
            <button class="sort-tab" data-sort="distance_meters">更方便到达</button>
          </div>
          <div class="toolbar-actions">
            <a id="map-link" class="ghost-action" href="/map-view">查看位置分布</a>
            <div id="data-source" class="data-source"></div>
          </div>
        </div>
        <div id="list-status" class="status-line">正在整理附近店铺的公开评论...</div>
        <div id="restaurant-list" class="restaurant-list"></div>
      </section>
    </main>

    <script src="/assets/recommendations.js"></script>
  </body>
</html>
