<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>导入评论</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css?v=20260426" />
  </head>
  <body class="page-import">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel import-hero">
        <a id="import-back-link" class="ghost-link" href="/">返回</a>
        <p class="eyebrow">Review Import</p>
        <h1>把最新评论喂给系统</h1>
        <p class="hero-text">
          支持把本地整理好的 JSON 或 CSV 评论直接导入到指定店铺。导入后，推荐分和详情分析会立即重算。
        </p>
      </section>

      <section class="import-layout">
        <article class="panel import-panel">
          <div class="panel-header">
            <p class="eyebrow">Import Form</p>
            <h2>导入设置</h2>
          </div>

          <form id="import-form" class="import-form">
            <div class="field-group">
              <label for="restaurant-id">店铺 ID</label>
              <input id="restaurant-id" name="restaurant_id" type="text" placeholder="例如 r001" required />
            </div>

            <div class="field-group">
              <span class="field-label">格式</span>
              <div class="chip-grid compact" data-group="import-format">
                <label class="chip chip-active"><input type="radio" name="format" value="json" checked />JSON</label>
                <label class="chip"><input type="radio" name="format" value="csv" />CSV</label>
              </div>
            </div>

            <div class="field-group">
              <div class="field-row">
                <label for="review-file">本地文件</label>
                <span class="card-meta">支持 `.json` / `.csv`</span>
              </div>
              <input id="review-file" type="file" accept=".json,.csv,text/csv,application/json" />
            </div>

            <div class="field-group">
              <div class="field-row">
                <label for="review-content">评论内容</label>
                <button id="use-sample" class="ghost-action" type="button">填充示例</button>
              </div>
              <textarea id="review-content" name="content" class="import-textarea" required></textarea>
            </div>

            <div class="import-actions">
              <button class="primary-button" type="submit">提交导入</button>
              <a id="import-detail-link" class="secondary-button" href="/">查看店铺详情</a>
            </div>
          </form>
        </article>

        <aside class="panel import-side-panel">
          <div class="panel-header compact-header">
            <p class="eyebrow">Result</p>
            <h2>导入结果</h2>
          </div>
          <div id="import-result" class="map-selection-empty">
            还没有提交导入。建议先用示例格式测试一轮，再贴你的真实评论。
          </div>
        </aside>
      </section>
    </main>

    <script src="/assets/review-import.js?v=20260426"></script>
  </body>
</html>
