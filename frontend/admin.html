<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css?v=20260428fix1" />
  </head>
  <body class="page-admin">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel import-hero">
        <a class="ghost-link" href="/review-import">返回导入页</a>
        <p class="eyebrow">Admin Dashboard</p>
        <h1>校园评论后台</h1>
        <p class="hero-text">查看同学共建的评论记录、店铺基础信息缓存，以及当前评论覆盖情况。</p>
        <div class="field-group admin-token-panel">
          <label for="admin-token">管理令牌</label>
          <div class="field-row">
            <input id="admin-token" name="admin_token" type="password" placeholder="输入 ADMIN_TOKEN 后加载后台数据" />
            <button id="save-admin-token" class="ghost-action" type="button">保存本次会话</button>
          </div>
        </div>
        <div class="admin-toolbar">
          <button id="reset-trial-data" class="secondary-button danger-button" type="button">
            清空试运行数据
          </button>
          <p id="reset-feedback" class="card-meta">
            会清空历史导入评价和已缓存餐厅信息，适合开始新一轮评论采样前使用。
          </p>
        </div>
      </section>

      <section class="admin-layout">
        <article class="panel admin-panel">
          <div class="panel-header compact-header">
            <p class="eyebrow">Imported Restaurants</p>
            <h2>已收录评价的店铺</h2>
          </div>
          <div id="admin-restaurants" class="admin-list"></div>
        </article>

        <article class="panel admin-panel">
          <div class="panel-header compact-header">
            <p class="eyebrow">Recent Review Records</p>
            <h2>最近收录的评价</h2>
          </div>
          <div id="admin-reviews" class="admin-list"></div>
        </article>

        <article class="panel admin-panel">
          <div class="panel-header compact-header">
            <p class="eyebrow">Cached Restaurants</p>
            <h2>已缓存店铺基础信息</h2>
          </div>
          <div id="admin-cached-restaurants" class="admin-list"></div>
        </article>
      </section>
    </main>

    <script src="/assets/shared.js?v=20260428fix1"></script>
    <script src="/assets/admin.js?v=20260428fix1"></script>
  </body>
</html>
