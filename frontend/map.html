<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地图视图</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="page-map">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel list-header-panel">
        <div>
          <a class="ghost-link" href="javascript:history.back()">返回榜单</a>
          <p class="eyebrow">Comment Map View</p>
          <h1>地图上看看附近哪几家更有讨论</h1>
        </div>
        <div id="map-filter-summary" class="filter-summary"></div>
      </section>

      <section class="map-layout">
        <article class="panel map-panel">
          <div class="map-legend">
            <span class="filter-pill">地图主要帮你看位置分布</span>
            <span class="filter-pill">中心：你的当前位置</span>
            <span class="filter-pill">点击标记可看评论概况</span>
          </div>
          <div class="real-map-shell">
            <div id="real-map" class="real-map"></div>
            <div id="map-fallback" class="map-fallback hidden">
              真实地图暂时不可用，请检查高德 JS API Key / 安全密钥配置。
            </div>
          </div>
          <div id="map-status" class="status-line">正在载入餐厅坐标...</div>
        </article>

        <aside class="panel map-side-panel">
          <div class="panel-header compact-header">
            <p class="eyebrow">Selected Restaurant</p>
            <h2>评论概况</h2>
          </div>
          <div id="map-selection" class="map-selection-empty">
            点一下地图标记，右侧会显示这家店最近的评论概况。
          </div>
          <div class="panel-header compact-header" style="margin-top: 22px">
            <p class="eyebrow">Nearby Candidates</p>
            <h2>附近可看的店</h2>
          </div>
          <div id="map-restaurant-list" class="map-restaurant-list"></div>
        </aside>
      </section>
    </main>

    <script src="/assets/map.js"></script>
  </body>
</html>
