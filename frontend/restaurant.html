<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>店铺详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="page-detail">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel detail-hero" id="detail-hero">
        <div id="detail-status" class="status-line">正在加载店铺详情...</div>
      </section>
      <section class="detail-grid" id="detail-grid"></section>
      <section class="panel" style="margin-top: 20px">
        <div class="panel-header compact-header">
          <p class="eyebrow">Real Feedback</p>
          <h2>写下你的真实评价，和同学一起共建口碑库</h2>
        </div>
        <form id="feedback-form" class="import-form">
          <div class="field-group">
            <span class="field-label">打分</span>
            <div class="chip-grid compact" data-group="feedback-rating">
              <label class="chip"><input type="radio" name="rating" value="1" required />1分</label>
              <label class="chip"><input type="radio" name="rating" value="2" />2分</label>
              <label class="chip"><input type="radio" name="rating" value="3" checked />3分</label>
              <label class="chip"><input type="radio" name="rating" value="4" />4分</label>
              <label class="chip"><input type="radio" name="rating" value="5" />5分</label>
            </div>
          </div>
          <div class="field-group">
            <label for="feedback-content">你的评价</label>
            <textarea id="feedback-content" class="import-textarea" placeholder="例如：晚上排队久，但味道稳定，适合宿舍聚餐。" required></textarea>
          </div>
          <div class="field-group">
            <div class="detail-block" style="padding: 16px 18px">
              <p class="eyebrow">Why Your Feedback Matters</p>
              <h2 style="font-size: 1.05rem">这条评价会直接影响什么</h2>
              <ul class="reason-list">
                <li>会立刻计入这家店的近期口碑与避雷分析</li>
                <li>会影响后续同学看到的推荐排序和风险标签</li>
                <li>评价越真实，整个校园口碑库越有参考价值</li>
              </ul>
            </div>
          </div>
          <div class="import-actions">
            <button id="feedback-submit" class="primary-button" type="submit">提交真实评价</button>
          </div>
          <div id="feedback-result" class="status-line">提交后会立即重算这家店的评价结果，并更新口碑判断。</div>
        </form>
      </section>
    </main>

    <script src="/assets/restaurant.js"></script>
  </body>
</html>
