<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>店铺详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css?v=20260428fix1" />
  </head>
  <body class="page-detail">
    <div class="background-grid"></div>
    <main class="shell">
      <section class="panel detail-hero" id="detail-hero">
        <div id="detail-status" class="status-line">正在加载店铺详情...</div>
      </section>
      <section class="detail-grid" id="detail-grid"></section>
      <section class="panel" style="margin-top: 20px">
        <div class="panel-header compact-header">
          <p class="eyebrow">Campus Comments</p>
          <h2>大家的真实评论</h2>
        </div>
        <div id="public-reviews" class="admin-list"></div>
      </section>
      <section class="panel" style="margin-top: 20px">
        <div class="panel-header compact-header">
          <p class="eyebrow">Leave A Comment</p>
          <h2>写下你的评论</h2>
        </div>
        <form id="feedback-form" class="import-form">
          <div class="field-group">
            <span class="field-label">这家店你怎么打</span>
            <div class="chip-grid compact" data-group="feedback-rating">
              <label class="chip"><input type="radio" name="rating" value="1" />拉完了</label>
              <label class="chip"><input type="radio" name="rating" value="2" />NPC</label>
              <label class="chip"><input type="radio" name="rating" value="3" checked />人上人</label>
              <label class="chip"><input type="radio" name="rating" value="4" />顶级</label>
              <label class="chip"><input type="radio" name="rating" value="5" />夯</label>
            </div>
          </div>
          <div class="field-group">
            <label for="feedback-content">你的评论</label>
            <textarea id="feedback-content" class="import-textarea" placeholder="例如：晚上有点排队，但分量可以，适合和同学一起去。" required></textarea>
          </div>
          <div class="field-group">
            <div class="detail-block" style="padding: 16px 18px">
              <p class="eyebrow">How It Works</p>
              <h2 style="font-size: 1.05rem">现在先做最简单的评论共建</h2>
              <ul class="reason-list">
                <li>任何人都可以直接提交一条真实评论</li>
                <li>评论提交后会立刻展示给后来的人看</li>
                <li>打分和更复杂的排序规则放到下一阶段再做</li>
              </ul>
            </div>
          </div>
          <div class="import-actions">
            <button id="feedback-submit" class="primary-button" type="submit">发布评论</button>
          </div>
          <div id="feedback-result" class="status-line">提交后会立即出现在这家店的评论区里。</div>
        </form>
      </section>
    </main>

    <script src="/assets/shared.js?v=20260428fix1"></script>
    <script src="/assets/restaurant.js?v=20260428fix1"></script>
  </body>
</html>
