name: where-to-eat
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_DB: where_to_eat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wte -d where_to_eat']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://wte:${POSTGRES_PASSWORD}@db:5432/where_to_eat
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run npm run setup first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup first}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
